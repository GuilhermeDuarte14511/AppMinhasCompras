name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Cloud Functions lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run check

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Enforce coverage floor
        run: dart run tool/check_coverage.dart coverage/lcov.info 45

      - name: Build Web release
        run: flutter build web --release

      - name: Create ephemeral Android signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload.jks \
            -storepass ci-password \
            -keypass ci-password \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=Minhas Compras, L=CI, ST=CI, C=BR"
          {
            echo "storePassword=ci-password"
            echo "keyPassword=ci-password"
            echo "keyAlias=upload"
            echo "storeFile=../ci-upload.jks"
          } > android/key.properties

      - name: Build Android App Bundle release
        run: flutter build appbundle --release

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Scan the delivered tree/new commit. The repository has an accepted
          # historical exposure documented separately, so a full-history scan
          # would keep every future quality run permanently red.
          fetch-depth: 1

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2

  firestore-rules:
    name: Firestore security matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-lista-compras-ci
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.23.0

      - name: Run Firestore Rules matrix
        shell: pwsh
        run: >
          firebase emulators:exec
          --config firebase.rules-test.json
          --only auth,firestore
          --project $env:GCLOUD_PROJECT
          "pwsh -NoLogo -NoProfile -File ./test/firestore/shared_lists_rules_emulator.ps1"
