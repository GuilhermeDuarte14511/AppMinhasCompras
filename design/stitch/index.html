<style>
:root{color-scheme:light;--bg:#f7f5ef;--ink:#252923;--muted:#62695f;--line:#d9dcd3;--accent:#365943}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
header{padding:32px clamp(20px,4vw,64px) 24px;border-bottom:1px solid var(--line)}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,52px);line-height:1.08;margin:0 0 8px}

.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input{font:inherit;background:#fffefa;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:min(100%,290px)}
.count{font-size:13px;color:var(--muted)}
main{padding:28px clamp(20px,4vw,64px) 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:28px 22px}
figure{margin:0;min-width:0}
.preview{display:block;background:#fffefa;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:560px}
.preview img{display:block;width:100%;height:auto}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 2px;font-weight:600}
figcaption small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.preview{transition:border-color .18s ease,transform .18s ease}.preview:hover{border-color:var(--accent);transform:translateY(-2px)}}
</style>
