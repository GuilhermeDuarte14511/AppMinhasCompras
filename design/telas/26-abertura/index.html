<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col justify-center items-center m-0 p-0 selection:bg-primary selection:text-surface-bright">
<!-- Mobile Viewport Container 390px -->
<main class="w-full max-w-[390px] h-[844px] max-h-screen flex flex-col justify-between items-center relative overflow-hidden bg-surface px-8 py-12 border-x border-outline-variant/20 shadow-none">
<!-- Linhas Sutis de Caderno (Textura Tonal Editorial) -->
<div class="absolute inset-0 pointer-events-none caderno-line opacity-60 z-0"></div>
<!-- Topo Editorial Limpo: Marcador de Cabeçalho / Registro Oficial -->
<!-- Centro da Tela: Identidade Visual Icônica & Logotipo Editorial -->
<div class="flex flex-col items-center justify-center text-center my-auto z-10 w-full px-2">
<!-- Emblema / Símbolo Contábil: Linhas Limpas de Caderno e Bolsa Mercado -->
<div class="relative w-20 h-20 mb-8 flex items-center justify-center">
<!-- Moldura Fina de Papelaria / Selo de Mercado -->
<div class="absolute inset-0 rounded-lg border border-outline-variant/70 bg-surface-container-lowest/80 flex items-center justify-center">
<div class="w-[70px] h-[70px] rounded border border-dashed border-outline-variant/40"></div>
</div>
<!-- Ícone Canônico Conforme Brand Anchors: menu_book -->
<div class="relative z-10 flex items-center justify-center text-primary" data-icon="menu_book">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 0, 'wght' 300;">menu_book</span>
</div>
</div>
<!-- Logotipo da Marca 'Minhas Compras' (Newsreader Serif Editorial) -->
<h1 class="font-headline text-[34px] leading-tight font-normal tracking-tight text-on-surface mb-2.5">
        Minhas Compras
      </h1>
<!-- Subtítulo Limpo e Contábil -->
<!-- Indicador Contábil de Carregamento: Barra de Progresso Fina Verde Folha -->
<div class="mt-12 w-full max-w-[190px] flex flex-col items-center">
<div class="w-full h-[2px] bg-outline-variant/35 rounded-full overflow-hidden relative">
<!-- Barra com avanço contábil sutil em verde folha -->
<div class="h-full bg-primary transition-all duration-700 ease-out" id="progress-bar" style="width: 28%;"></div>
</div>
<!-- Marcador numérico tabular discreto -->
</div>
</div>
<!-- Rodapé Editorial Discreto: Estado do Caderno -->
<footer class="w-full pb-2 flex flex-col items-center justify-center text-center z-10">
<div class="flex items-center gap-1.5 mb-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary/70 animate-pulse"></span>
<p class="font-body text-[12px] font-normal text-on-surface-variant tracking-normal" id="status-label">Preparando caderno de compras...</p>
</div>
<!-- Assinatura de Versão Contábil -->
</footer>
</main>
<!-- Script Suave de Transição de Estado Editorial (Sem interatividade externa) -->
<script>
    (function() {
      const progressBar = document.getElementById('progress-bar');
      const progressPercent = document.getElementById('progress-percent');
      const statusLabel = document.getElementById('status-label');

      let step = 0;
      const sequence = [
        { pct: 28, text: "Carregando caderno..." },
        { pct: 64, text: "Sincronizando itens e despensa..." },
        { pct: 92, text: "Organizando registros..." },
        { pct: 100, text: "Pronto para uso." }
      ];

      const interval = setInterval(() => {
        step++;
        if (step < sequence.length) {
          const current = sequence[step];
          if (progressBar) progressBar.style.width = current.pct + '%';
          if (progressPercent) progressPercent.textContent = current.pct + '%';
          if (statusLabel) statusLabel.textContent = current.text;
        } else {
          clearInterval(interval);
        }
      }, 950);
    })();
  </script>
</body></html>
