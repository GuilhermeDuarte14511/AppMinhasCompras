<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voz — Captura | Minhas Compras</title>
<!-- Fonts: Newsreader (display/headline) & Public Sans (body/labels) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with CDN plugin container -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary": "#582f33",
            "surface": "#fbf9f3",
            "error-container": "#ffdad6",
            "surface-container-low": "#f5f3ed",
            "secondary-fixed": "#e0e5cf",
            "on-secondary-container": "#616655",
            "inverse-primary": "#a9d0b4",
            "on-background": "#1b1c18",
            "tertiary-container": "#724549",
            "on-tertiary": "#ffffff",
            "outline-variant": "#c1c8c1",
            "on-secondary-fixed": "#191d10",
            "inverse-on-surface": "#f3f1eb",
            "on-surface-variant": "#424843",
            "tertiary-fixed-dim": "#f4b7bb",
            "on-secondary": "#ffffff",
            "outline": "#727972",
            "on-error": "#ffffff",
            "background": "#fbf9f3",
            "on-surface": "#1b1c18",
            "primary": "#1f412d",
            "on-tertiary-container": "#f2b6ba",
            "error": "#ba1a1a",
            "surface-tint": "#43664f",
            "surface-container-lowest": "#ffffff",
            "secondary-container": "#e0e5cf",
            "surface-dim": "#dcdad4",
            "secondary": "#5b604f",
            "secondary-fixed-dim": "#c4c9b4",
            "on-secondary-fixed-variant": "#444939",
            "surface-container": "#f0eee8",
            "on-tertiary-fixed-variant": "#663b3f",
            "on-tertiary-fixed": "#321015",
            "primary-container": "#365943",
            "tertiary-fixed": "#ffdadb",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#2b4e39",
            "surface-container-high": "#eae8e2",
            "primary-fixed-dim": "#a9d0b4",
            "on-primary-container": "#a7ceb2",
            "surface-bright": "#fbf9f3",
            "on-error-container": "#93000a",
            "inverse-surface": "#30312d",
            "surface-variant": "#e4e2dd",
            "surface-container-highest": "#e4e2dd",
            "primary-fixed": "#c4eccf",
            "on-primary-fixed": "#002110"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Newsreader", "serif"],
            "display": ["Newsreader", "serif"],
            "body": ["Public Sans", "sans-serif"],
            "label": ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      user-select: none;
    }
    
    /* Discreto pulso editorial analógico */
    @keyframes editorial-pulse {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(54, 89, 67, 0.25);
      }
      70% {
        transform: scale(1.03);
        box-shadow: 0 0 0 14px rgba(54, 89, 67, 0);
      }
      100% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(54, 89, 67, 0);
      }
    }

    .pulse-ring {
      animation: editorial-pulse 2.2s infinite ease-in-out;
    }

    /* Traço de cursor de texto piscante */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor {
      animation: blink 1s infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex justify-center items-end sm:items-center p-0 sm:p-4 selection:bg-secondary-container selection:text-on-secondary-fixed selection:bg-opacity-50">
<!-- Simulação do Mockup Mobile 390px com Scrim de Fundo -->
<div class="relative w-full max-w-[390px] h-[844px] bg-background overflow-hidden shadow-2xl flex flex-col justify-end">
<!-- CONTEXTO DE FUNDO: Lista Minhas Compras por trás do modal scrim -->
<div aria-hidden="true" class="absolute inset-0 px-5 pt-8 pb-32 opacity-35 select-none pointer-events-none">
<div class="flex items-center justify-between border-b border-outline-variant pb-3 mb-5">
<div>
<span class="text-xs font-medium text-secondary uppercase tracking-wider">Lista ativa</span>
<h1 class="font-headline text-3xl font-medium text-on-surface tracking-tight">Feira Semanal</h1>
</div>
<span class="text-xs tabular-nums text-secondary">14 itens</span>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between py-2 border-b border-surface-container-high">
<div class="flex items-center gap-3">
<div class="w-4 h-4 rounded border border-outline"></div>
<span class="text-sm font-medium">Azeite extravirgem</span>
</div>
<span class="text-xs text-secondary">1 un</span>
</div>
<div class="flex items-center justify-between py-2 border-b border-surface-container-high">
<div class="flex items-center gap-3">
<div class="w-4 h-4 rounded border border-outline"></div>
<span class="text-sm font-medium">Leite integral</span>
</div>
<span class="text-xs text-secondary">3 un</span>
</div>
<div class="flex items-center justify-between py-2 border-b border-surface-container-high">
<div class="flex items-center gap-3">
<div class="w-4 h-4 rounded border border-outline"></div>
<span class="text-sm font-medium">Café em grãos</span>
</div>
<span class="text-xs text-secondary">500g</span>
</div>
<div class="flex items-center justify-between py-2 border-b border-surface-container-high">
<div class="flex items-center gap-3">
<div class="w-4 h-4 rounded border border-outline"></div>
<span class="text-sm font-medium">Maçã Gala</span>
</div>
<span class="text-xs text-secondary">1 kg</span>
</div>
</div>
</div>
<!-- MODAL SCRIM ESCURECIDO -->
<div class="absolute inset-0 bg-[#1B1C18] bg-opacity-45 backdrop-blur-[1px] transition-opacity duration-200"></div>
<!-- BOTTOM SHEET CONTAINER: VoiceQuickAddSheet (Estado: Voz — captura) -->
<section class="relative z-10 w-full bg-surface-container-lowest rounded-t-3xl border-t border-outline-variant flex flex-col pt-3 pb-8 px-5 shadow-[0_-8px_30px_rgba(27,28,24,0.08)]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pb-2">
<div aria-hidden="true" class="w-10 h-1 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Header TopAppBar (Reflete Shared Components JSON estritamente) -->
<header class="relative flex items-center justify-center w-full h-14 border-b border-outline-variant px-1 mb-6">
<button aria-label="Fechar captura por voz" class="absolute left-1 w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h2 class="font-headline text-2xl font-normal text-on-surface tracking-tight">Adicionar por voz</h2>
</header>
<!-- Active Voice Capture Body -->
<div class="flex flex-col items-center w-full">
<!-- Bloco do Microfone Ativo / Gravando -->
<div class="relative flex flex-col items-center justify-center my-3">
<!-- Halo indicador de captação ativa -->
<div class="absolute w-24 h-24 rounded-full border border-primary-container opacity-30 pulse-ring"></div>
<!-- Botão Principal do Microfone -->
<button aria-label="Gravando áudio. Toque para parar a gravação" class="relative w-20 h-20 rounded-full bg-primary-container text-on-primary flex items-center justify-center active:scale-95 transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="button">
<span class="material-symbols-outlined text-[36px]" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Status Contextual da Voz -->
<div aria-live="polite" class="flex items-center gap-2 mt-4 mb-7" role="status">
<p class="font-body text-sm font-medium text-on-surface tracking-normal">
            Ouvindo… toque para parar
          </p>
</div>
<!-- Transcrição Editável em Tempo Real -->
<div class="w-full text-left mb-6">
<div class="flex justify-between items-baseline mb-2">
<label class="font-body text-xs font-semibold text-secondary uppercase tracking-wider" for="transcription-input">
              Itens reconhecidos
            </label>
</div>
<!-- Caixa de transcrição com aspecto editorial e traço limpo -->
<div class="relative w-full rounded-lg border border-outline bg-surface-bright p-3.5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<div class="flex items-start gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[18px] mt-0.5 select-none" data-icon="edit">edit</span>
<div class="flex-1">
<textarea class="w-full p-0 text-base leading-relaxed font-body text-on-surface bg-transparent border-0 resize-none focus:ring-0 focus:outline-none placeholder-outline" id="transcription-input" placeholder="Diga os itens e quantidades..." rows="2">dois detergentes, um arroz e três sabonetes</textarea>
</div>
</div>
<!-- Barra de Dica Discreta de Sintaxe Oral -->
<div class="mt-2.5 pt-2 border-t border-surface-container flex items-center justify-between text-[11px] text-secondary">
<span>Fale naturalmente nomes e quantidades</span>
</div>
</div>
</div>
<!-- Botão de Ação: "Analisar itens" (DESABILITADO durante a escuta) -->
<div class="w-full pt-1">
<button aria-disabled="true" class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-body text-sm font-semibold tracking-wide opacity-50 cursor-not-allowed flex items-center justify-center gap-2 select-none shadow-none" disabled="" title="Pare a gravação para analisar os itens" type="button">
<span>Analisar itens</span>
<span aria-hidden="true" class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Barra de Espaçamento Seguro (Home Indicator) -->
<div class="w-full flex justify-center pt-5 pb-1">
<div aria-hidden="true" class="w-32 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</section>
</div>
</body></html>
