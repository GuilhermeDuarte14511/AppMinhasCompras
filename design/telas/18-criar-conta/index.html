<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar conta — Minhas Compras</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Newsreader & Public Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Public+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary": "#582f33",
            "on-secondary-container": "#616655",
            "inverse-on-surface": "#f3f1eb",
            "on-tertiary-fixed-variant": "#663b3f",
            "on-primary": "#ffffff",
            "secondary-fixed-dim": "#c4c9b4",
            "on-secondary-fixed-variant": "#444939",
            "on-tertiary-container": "#f2b6ba",
            "secondary-container": "#e0e5cf",
            "background": "#fcfbf7",
            "surface-container-lowest": "#ffffff",
            "surface-variant": "#e4e2dd",
            "surface-bright": "#fcfbf7",
            "primary": "#1f412d",
            "secondary-fixed": "#e0e5cf",
            "primary-fixed-dim": "#a9d0b4",
            "surface-tint": "#43664f",
            "tertiary-fixed": "#ffdadb",
            "surface-container-highest": "#e4e2dd",
            "on-error-container": "#93000a",
            "on-error": "#ffffff",
            "surface-container-low": "#f5f3ed",
            "on-secondary-fixed": "#191d10",
            "on-primary-fixed": "#002110",
            "error-container": "#ffdad6",
            "surface-dim": "#dcdad4",
            "surface-container": "#f0eee8",
            "outline-variant": "#c1c8c1",
            "on-primary-container": "#a7ceb2",
            "error": "#ba1a1a",
            "on-surface": "#1b1c18",
            "outline": "#727972",
            "tertiary-fixed-dim": "#f4b7bb",
            "on-primary-fixed-variant": "#2b4e39",
            "inverse-surface": "#30312d",
            "surface-container-high": "#eae8e2",
            "primary-fixed": "#c4eccf",
            "surface": "#fcfbf7",
            "on-tertiary": "#ffffff",
            "primary-container": "#365943",
            "on-tertiary-fixed": "#321015",
            "secondary": "#5b604f",
            "on-background": "#1b1c18",
            "on-surface-variant": "#424843",
            "on-secondary": "#ffffff",
            "tertiary-container": "#724549",
            "inverse-primary": "#a9d0b4"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Newsreader", "serif"],
            "display": ["Newsreader", "serif"],
            "body": ["Public Sans", "sans-serif"],
            "label": ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    input::placeholder {
      color: #9aa197;
    }
    body {
      min-height: max(884px, 100dvh);
      background-color: #fcfbf7;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex justify-center selection:bg-secondary-container selection:text-primary">
<!-- Mobile Container -->
<main class="w-full max-w-[390px] min-h-screen bg-surface flex flex-col justify-between border-x border-outline-variant/30">
<!-- Top App Bar / Navegação Superior -->
<header class="w-full px-5 pt-4 pb-3 flex items-center justify-between border-b border-outline-variant/40">
<a class="inline-flex items-center gap-1.5 text-on-surface-variant hover:text-primary transition-colors py-1 pr-2 active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="arrow_back">arrow_back</span>
<span class="font-body text-xs font-medium text-secondary">Voltar</span>
</a>
<!-- Brand Name -->
<div>
<span class="font-headline italic text-lg font-medium text-primary tracking-tight">Minhas Compras</span>
</div>
</header>
<!-- Main Content Area -->
<div class="px-6 pt-7 pb-8 flex-1 flex flex-col justify-center">
<!-- Cabeçalho da Tela -->
<div class="mb-6">
<h1 class="font-headline text-3xl font-medium text-on-surface tracking-tight leading-snug">Criar conta</h1>
<p class="font-body text-[14px] text-on-surface-variant mt-1.5 leading-relaxed">
          Preencha os dados abaixo para começar a organizar suas compras.
        </p>
</div>
<!-- Formulário de Cadastro -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- 1. Nome completo -->
<div class="space-y-1.5">
<label class="block font-body text-xs font-medium text-on-surface" for="fullname">
            Nome completo
          </label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface font-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-150 shadow-none" id="fullname" name="fullname" placeholder="Ex.: Maria Clara Silveira" required="" type="text"/>
</div>
</div>
<!-- 2. E-mail -->
<div class="space-y-1.5">
<label class="block font-body text-xs font-medium text-on-surface" for="email">
            E-mail
          </label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface font-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-150 shadow-none" id="email" name="email" placeholder="nome@exemplo.com.br" required="" type="email"/>
</div>
</div>
<!-- 3. Senha -->
<div class="space-y-1.5">
<label class="block font-body text-xs font-medium text-on-surface" for="password">
            Senha
          </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface font-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-150 shadow-none" id="password" name="password" placeholder="Pelo menos 8 caracteres" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-0 top-0 bottom-0 px-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- 4. Confirmar senha -->
<div class="space-y-1.5">
<label class="block font-body text-xs font-medium text-on-surface" for="confirm_password">
            Confirmar senha
          </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm text-on-surface font-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-150 shadow-none" id="confirm_password" name="confirm_password" placeholder="Repita a senha criada" required="" type="password"/>
<button aria-label="Alternar visibilidade da confirmação de senha" class="absolute right-0 top-0 bottom-0 px-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility('confirm_password', this)" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Ações Principais -->
<div class="pt-4 space-y-3">
<!-- Botão Primário: Criar conta -->
<button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-body font-medium text-[15px] rounded-lg flex items-center justify-center transition-colors duration-150 active:scale-[0.99]" type="submit">
            Criar conta
          </button>
<!-- Botão Secundário: Já tem uma conta? Entrar -->
<a class="w-full h-12 border border-outline-variant hover:bg-surface-container-low text-on-surface font-body font-medium text-[14px] rounded-lg flex items-center justify-center transition-colors duration-150 text-center active:scale-[0.99]" href="#">
            Já tem uma conta? Entrar
          </a>
</div>
</form>
</div>
</main>
<!-- Interactive script for password visibility toggle -->
<script>
    function togglePasswordVisibility(fieldId, triggerBtn) {
      const field = document.getElementById(fieldId);
      const iconSpan = triggerBtn.querySelector('.material-symbols-outlined');
      if (!field || !iconSpan) return;

      if (field.type === 'password') {
        field.type = 'text';
        iconSpan.textContent = 'visibility_off';
      } else {
        field.type = 'password';
        iconSpan.textContent = 'visibility';
      }
    }
  </script>
</body></html>
