<!-- Interactive State Calculator -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const checkboxes = document.querySelectorAll('.item-checkbox');
      const counterEl = document.getElementById('selected-counter');
      const subtotalEl = document.getElementById('subtotal-display');
      const submitLabelEl = document.getElementById('submit-label');
      const submitBtn = document.getElementById('submit-button');

      function updateSummary() {
        let count = 0;
        let total = 0;

        checkboxes.forEach(cb => {
          if (cb.checked) {
            count++;
            const price = parseFloat(cb.dataset.price) || 0;
            total += price;
          }
        });

        const totalFormatted = total.toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

        counterEl.textContent = `${count} de ${checkboxes.length} selecionados`;
        subtotalEl.textContent = `R$ ${totalFormatted}`;
        submitLabelEl.textContent = `Criar lista (${count})`;

        if (count === 0) {
          submitBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          submitBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }

      checkboxes.forEach(cb => {
        cb.addEventListener('change', updateSummary);
      });

      // Initial execution
      updateSummary();
    });
  </script>
