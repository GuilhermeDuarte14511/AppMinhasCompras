<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex justify-center selection:bg-primary selection:text-on-primary">
<!-- Mobile Viewport Wrapper (390px) -->
<div class="w-full max-w-[390px] min-h-screen bg-surface flex flex-col justify-between">
<!-- Top Hierarchy & Content -->
<div class="w-full flex flex-col">
<!-- TopAppBar (from Shared Components JSON & Style Tokens) -->
<header class="flex justify-between items-center w-full px-4 h-14 bg-surface docked full-width top-0 border-b border-outline-variant">
<button aria-label="Voltar" class="p-2 -ml-2 rounded-full text-on-surface hover:bg-surface-container active:opacity-80 transition-colors inline-flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline text-2xl text-on-surface font-normal tracking-tight">Minhas Finanças</h1>
</header>
<!-- Main Integration Canvas -->
<main class="px-5 pt-8 pb-6 flex flex-col">
<!-- Header Symbol & Title Block -->
<div class="flex flex-col items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[28px]" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="flex flex-col gap-2">
<h2 class="font-headline text-[28px] leading-tight text-on-surface font-normal">
              Conectar ao Minhas Finanças
            </h2>
<p class="font-body text-[15px] leading-relaxed text-on-surface-variant">
              No app de Finanças, abra Configurações &gt; Minhas Compras e gere um código temporário.
            </p>
</div>
</div>
<!-- Connection Form -->
<form class="mt-8 flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-semibold tracking-wider text-on-surface-variant uppercase" for="connection-code">
              CÓDIGO DE CONEXÃO
            </label>
<div class="relative">
<input autocomplete="off" autocorrect="off" class="w-full h-12 px-3.5 bg-surface-container-lowest border border-outline rounded-lg font-mono text-[16px] tracking-widest text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container uppercase transition-colors" id="connection-code" maxlength="14" name="connection-code" placeholder="ABCD-EFGH-IJKL" spellcheck="false" type="text"/>
</div>
</div>
<!-- Primary Submit Action -->
<button class="w-full h-12 bg-primary-container text-on-primary font-label text-[15px] font-medium rounded-lg flex items-center justify-center hover:opacity-95 active:opacity-85 transition-opacity" type="submit">
            Conectar
          </button>
</form>
<!-- Informative Support Block -->
<div class="mt-8 p-4 rounded-lg bg-surface-container-low border border-outline-variant flex gap-3 items-start">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0 mt-0.5" data-icon="lock_outline">lock_outline</span>
<p class="font-body text-[13px] leading-normal text-on-surface-variant">
            O código expira em 10 minutos. A credencial permanente fica protegida no armazenamento seguro do aparelho.
          </p>
</div>
</main>
</div>
<!-- Minimal Contextual Brand Anchor / Footnote -->
</div>
<script>
    // Formatting mask for the temporary code ABCD-EFGH-IJKL
    const codeInput = document.getElementById('connection-code');
    if (codeInput) {
      codeInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        if (val.length > 12) val = val.substring(0, 12);
        
        const parts = [];
        for (let i = 0; i < val.length; i += 4) {
          parts.push(val.substring(i, i + 4));
        }
        e.target.value = parts.join('-');
      });
    }
  </script>
