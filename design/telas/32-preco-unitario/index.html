<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar preço unitário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#f6fbf2',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f0f5ed',
            'surface-container': '#eaeport-ebf0e7',
            'surface-sheet': '#fafdf7',
            primary: '#1f412d',
            'primary-dark': '#163122',
            'primary-container': '#2a553c',
            'on-primary': '#ffffff',
            'on-surface': '#1b1c19',
            'on-surface-variant': '#44483e',
            outline: '#74796e',
            'outline-variant': '#c3c8bc',
          },
          fontFamily: {
            headline: ['Newsreader', 'serif'],
            body: ['Public Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: rgba(30, 33, 29, 0.45);
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-end items-center p-0 sm:p-4">
  <!-- Backdrop container simulando o contexto do app mobile 390px -->
  <main class="w-full max-w-[390px] min-h-screen flex flex-col justify-end">
    
    <!-- Bottom Sheet modal: ItemUnitPriceSheet -->
    <div class="w-full bg-[#fdfdf9] rounded-t-2xl border-t border-x border-[#c3c8bc] shadow-xl flex flex-col overflow-hidden pb-8 animate-in fade-in slide-in-from-bottom duration-200">
      
      <!-- Drag Handle -->
      <div class="w-full flex justify-center pt-3 pb-2" aria-hidden="true">
        <div class="w-10 h-1 bg-[#c3c8bc] rounded-full"></div>
      </div>

      <!-- Header da Bottom Sheet -->
      <header class="px-5 pt-1 pb-4 flex items-center justify-between border-b border-[#c3c8bc]/60">
        <div class="flex flex-col">
          <span class="text-[10px] uppercase tracking-wider font-semibold text-[#5a6054]">Item da lista</span>
          <h1 class="font-headline text-2xl font-normal text-[#1b1c19] tracking-tight">Atualizar preço unitário</h1>
        </div>
        <button type="button" aria-label="Fechar" class="w-9 h-9 flex items-center justify-center rounded-full text-[#44483e] hover:bg-[#eaeport-ebf0e7] active:bg-[#dce3d5] transition-colors">
          <span class="material-symbols-outlined text-[22px]">close</span>
        </button>
      </header>

      <!-- Conteúdo do Formulário -->
      <div class="px-5 pt-5 pb-6 flex flex-col gap-5">
        
        <!-- Identificação do Nome do Item (exemplo visual) -->
        <div class="flex flex-col gap-1">
          <span class="text-xs font-medium text-[#44483e]">Nome do item</span>
          <div class="w-full py-2.5 px-3 bg-[#f0f5ed] border border-[#c3c8bc] rounded-lg">
            <span class="text-base font-medium text-[#1b1c19]">Café torrado e moído 500g</span>
          </div>
        </div>

        <!-- Campo Preço Unitário -->
        <div class="flex flex-col gap-1.5">
          <label for="preco-unitario" class="text-xs font-semibold text-[#1b1c19]">
            Preço unitário
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-base font-semibold text-[#44483e]" aria-hidden="true">R$</span>
            <input 
              id="preco-unitario" 
              type="text" 
              inputmode="decimal" 
              value="24,90" 
              placeholder="0,00"
              class="w-full h-12 pl-11 pr-4 bg-white border border-[#74796e] focus:border-[#1f412d] focus:ring-1 focus:ring-[#1f412d] rounded-lg text-lg font-bold text-[#1b1c19] tracking-tight outline-none transition-all"
            />
          </div>
          <span class="text-[11px] text-[#5a6054]">
            Preço por unidade de medida para cálculo automático do subtotal.
          </span>
        </div>

      </div>

      <!-- Barra de Ações (botões primário e secundário) -->
      <footer class="px-5 pt-2 flex flex-col gap-2.5">
        <!-- Botão Atualizar preço -->
        <button 
          type="button" 
          class="w-full h-12 min-h-[48px] bg-[#1f412d] active:bg-[#163122] text-white font-medium text-base rounded-lg flex items-center justify-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1f412d]"
        >
          <span class="material-symbols-outlined text-[20px]">check</span>
          <span>Atualizar preço</span>
        </button>

        <!-- Botão Cancelar -->
        <button 
          type="button" 
          class="w-full h-12 min-h-[48px] bg-transparent hover:bg-[#f0f5ed] active:bg-[#eaeport-ebf0e7] text-[#1f412d] font-medium text-base rounded-lg border border-[#c3c8bc] flex items-center justify-center transition-colors focus:outline-none"
        >
          <span>Cancelar</span>
        </button>
      </footer>

    </div>
  </main>
</body>
</html>
