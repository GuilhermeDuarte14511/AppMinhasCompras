<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Usar lista como modelo</title>
<!-- Google Fonts: Newsreader (editorial serif) & Public Sans (sans body/numbers) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#f6fbf2',
            'surface-container': '#e8ece4',
            'surface-container-high': '#dfe3db',
            'surface-container-highest': '#d5d9d1',
            'surface-container-lowest': '#ffffff',
            'on-surface': '#191c1a',
            'on-surface-variant': '#404943',
            outline: '#707973',
            'outline-variant': '#bfc9c2',
            primary: '#1f412d',
            'on-primary': '#ffffff',
            'primary-container': '#365943',
            'on-primary-container': '#ffffff',
          },
          fontFamily: {
            headline: ['Newsreader', 'serif'],
            body: ['Public Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-black/40 min-h-screen flex flex-col justify-end items-center font-body text-on-surface antialiased p-0 m-0">
<!-- Mobile Sheet Container (390px max-width) -->
<main aria-labelledby="modal-title" aria-modal="true" class="w-full max-w-[390px] bg-surface rounded-t-2xl shadow-xl flex flex-col border-t border-outline-variant/60 overflow-hidden" role="dialog">
<!-- Drag Handle Indicator -->
<div class="w-full pt-3 pb-1 flex justify-center">
<div class="w-10 h-1 rounded-full bg-outline-variant/80"></div>
</div>
<!-- Header bar -->
<header class="flex items-center justify-between px-5 py-3 border-b border-outline-variant/40"><h1 class="font-headline text-2xl font-normal text-on-surface leading-tight" id="modal-title">Usar lista como modelo</h1>
<button aria-label="Fechar" class="w-10 h-10 -mr-2 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container active:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button></header>
<!-- Contextual Explanation / Guidance -->
<!-- Section label -->
<div class="px-5 pt-4 pb-2 flex items-center justify-between"><span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Listas recentes</span>
<span class="text-xs text-on-surface-variant/80">Toque para selecionar</span></div>
<!-- List of previous lists (Radio Group) -->
<div aria-label="Selecione uma lista anterior" class="flex-1 overflow-y-auto px-5 py-1 space-y-2.5 max-h-[380px] pb-5" role="radiogroup"><div class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/60 hover:border-primary active:bg-surface-container transition-all cursor-pointer shadow-sm min-h-[64px]" role="button" tabindex="0">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-headline text-lg text-on-surface font-medium truncate">Compras da semana</span>
<div class="flex items-center gap-2 mt-0.5 text-xs text-on-surface-variant font-body">
<span>14 itens</span>
<span>•</span>
<span class="font-medium text-primary">R$ 184,30</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>
</div>
<div class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/60 hover:border-primary active:bg-surface-container transition-all cursor-pointer shadow-sm min-h-[64px]" role="button" tabindex="0">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-headline text-lg text-on-surface font-medium truncate">Feira de sábado</span>
<div class="flex items-center gap-2 mt-0.5 text-xs text-on-surface-variant font-body">
<span>8 itens</span>
<span>•</span>
<span class="font-medium text-primary">R$ 64,50</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>
</div>
<div class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/60 hover:border-primary active:bg-surface-container transition-all cursor-pointer shadow-sm min-h-[64px]" role="button" tabindex="0">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-headline text-lg text-on-surface font-medium truncate">Reposição de despensa</span>
<div class="flex items-center gap-2 mt-0.5 text-xs text-on-surface-variant font-body">
<span>12 itens</span>
<span>•</span>
<span class="font-medium text-primary">R$ 142,80</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>
</div>
<div class="w-full flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/60 hover:border-primary active:bg-surface-container transition-all cursor-pointer shadow-sm min-h-[64px]" role="button" tabindex="0">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-headline text-lg text-on-surface font-medium truncate">Churrasco</span>
<div class="flex items-center gap-2 mt-0.5 text-xs text-on-surface-variant font-body">
<span>16 itens</span>
<span>•</span>
<span class="font-medium text-primary">R$ 215,90</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>
</div></div>
<!-- Actions Footer -->
</main>
</body>
</html>
