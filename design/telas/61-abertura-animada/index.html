<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abertura Animada — Minhas Compras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#F7F5EF',
            charcoal: '#252923',
            'charcoal-light': '#5A6157',
            leaf: '#365943',
            'leaf-dark': '#243D2E',
            'leaf-soft': '#E6EFE8',
            rule: '#E5E0D5',
            'rule-dark': '#D3CCC0'
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Public Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Reset & Viewport Lock */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F7F5EF;
      color: #252923;
      font-family: 'Public Sans', sans-serif;
      overflow: hidden;
    }

    /* Pauta sutil de caderno de compras no fundo */
    .notebook-bg {
      background-color: #F7F5EF;
      background-image: 
        radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.7) 0%, rgba(247,245,239,0) 70%),
        linear-gradient(to bottom, transparent 31px, rgba(211, 204, 192, 0.35) 32px);
      background-size: 100% 100%, 100% 32px;
    }

    /* Animações CSS com tempos calibrados (entrada 900ms) */
    
    /* 1. Entrada suave da tela inteira */
    .anim-fade-up {
      animation: fadeUp 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 2. Flutuação suave contínua do caderno */
    .anim-gentle-float {
      animation: gentleFloat 4.2s ease-in-out infinite;
    }

    /* 3. Abertura sutil da capa/página do caderno */
    .anim-cover-open {
      transform-origin: 24px 70px;
      animation: coverUnfold 1100ms cubic-bezier(0.2, 0.8, 0.2, 1) 200ms forwards;
    }

    /* 4. Desenho sequencial das linhas de texto do caderno */
    .line-draw {
      stroke-dasharray: 64;
      stroke-dashoffset: 64;
      animation: drawLine 650ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .line-1 { animation-delay: 450ms; }
    .line-2 { animation-delay: 750ms; }
    .line-3 { animation-delay: 1050ms; }

    /* 5. Checkmarks desenhando com traçado sequencial */
    .check-draw {
      stroke-dasharray: 18;
      stroke-dashoffset: 18;
      animation: drawCheck 450ms cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }
    .check-1 { animation-delay: 600ms; }
    .check-2 { animation-delay: 900ms; }
    .check-3 { animation-delay: 1200ms; }

    /* 6. Indicador de atividade indeterminado contábil */
    .track-runner {
      animation: activitySlide 2.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    /* Keyframes */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(0.4deg);
      }
    }

    @keyframes coverUnfold {
      0% {
        transform: rotate(0deg) skewY(0deg);
      }
      50% {
        transform: rotate(-3.5deg) skewY(-1.2deg);
      }
      100% {
        transform: rotate(-2deg) skewY(-0.6deg);
      }
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes activitySlide {
      0% {
        left: -35%;
        width: 35%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 25%;
      }
    }

    /* Suporte a prefers-reduced-motion: frame final estático instantâneo */
    @media (prefers-reduced-motion: reduce) {
      .anim-fade-up,
      .anim-gentle-float,
      .anim-cover-open,
      .line-draw,
      .check-draw,
      .track-runner {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
      }
      .track-runner {
        left: 20% !important;
        width: 60% !important;
      }
    }
  </style>
</head>
<body class="w-[390px] h-[844px] max-w-[390px] max-h-[844px] mx-auto notebook-bg relative flex flex-col justify-between items-center select-none px-6 py-10 antialiased">

  <!-- Margem de cabeçalho sutil estilo fichário / caderno contábil -->
  <header class="w-full flex items-center justify-between pt-3 pb-1 border-b border-rule/60 text-charcoal-light">
    <div class="flex items-center space-x-1.5">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-leaf"></span>
      <span class="text-[11px] font-medium tracking-wider uppercase text-charcoal/70">Mercado Editorial</span>
    </div>
    <div class="text-[11px] tracking-wide font-serif italic text-charcoal-light/80">
      Edição Cotidiana
    </div>
  </header>

  <!-- Área Central com Respiro Generoso e Visual Editorial -->
  <main class="w-full flex-1 flex flex-col items-center justify-center -mt-6 anim-fade-up">

    <!-- Emblema Vetorial: Caderno de Compras com Folheada e Traçado -->
    <div class="relative w-36 h-36 flex items-center justify-center anim-gentle-float mb-6">
      <!-- Glow neutro suave de fundo de página -->
      <div class="absolute inset-2 bg-leaf-soft/50 rounded-2xl blur-md -z-10"></div>

      <svg class="w-28 h-28 drop-shadow-sm overflow-visible" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração do caderno de compras animado">
        
        <!-- Sombra base do bloco do caderno -->
        <rect x="22" y="24" width="76" height="80" rx="7" fill="#E8E2D5" />

        <!-- Página traseira / miolo de páginas -->
        <rect x="20" y="22" width="76" height="80" rx="7" fill="#FCFAF5" stroke="#D3CCC0" stroke-width="1.5" />

        <!-- Folha frontal articulada (leve movimento de abertura de capa) -->
        <g class="anim-cover-open">
          <rect x="18" y="19" width="76" height="80" rx="7" fill="#FFFFFF" stroke="#252923" stroke-width="2" />
          
          <!-- Espiral / Encadernação clássica à esquerda -->
          <line x1="26" y1="20" x2="26" y2="98" stroke="#D3CCC0" stroke-width="1.5" stroke-dasharray="2 3" />
          
          <!-- Fita marcadora verde folha no topo do caderno -->
          <path d="M72 19V32L77 28L82 32V19H72Z" fill="#365943" />

          <!-- Item 1: Checkmark + Linha de Lista -->
          <g transform="translate(32, 38)">
            <!-- Checkbox sutil -->
            <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#E6EFE8" stroke="#365943" stroke-width="1.2" />
            <!-- Traçado animado do checkmark -->
            <path class="check-draw check-1" d="M2.5 5.5L4.8 7.8L8.8 3.2" stroke="#365943" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Linha de produto desenhada -->
            <line class="line-draw line-1" x1="17" y1="5.5" x2="52" y2="5.5" stroke="#252923" stroke-width="2.2" stroke-linecap="round" />
          </g>

          <!-- Item 2: Checkmark + Linha de Lista -->
          <g transform="translate(32, 56)">
            <!-- Checkbox sutil -->
            <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#E6EFE8" stroke="#365943" stroke-width="1.2" />
            <!-- Traçado animado do checkmark -->
            <path class="check-draw check-2" d="M2.5 5.5L4.8 7.8L8.8 3.2" stroke="#365943" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Linha de produto desenhada -->
            <line class="line-draw line-2" x1="17" y1="5.5" x2="48" y2="5.5" stroke="#252923" stroke-width="2.2" stroke-linecap="round" />
          </g>

          <!-- Item 3: Checkmark + Linha de Lista -->
          <g transform="translate(32, 74)">
            <!-- Checkbox sutil -->
            <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#E6EFE8" stroke="#365943" stroke-width="1.2" />
            <!-- Traçado animado do checkmark -->
            <path class="check-draw check-3" d="M2.5 5.5L4.8 7.8L8.8 3.2" stroke="#365943" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Linha de produto desenhada -->
            <line class="line-draw line-3" x1="17" y1="5.5" x2="42" y2="5.5" stroke="#252923" stroke-width="2.2" stroke-linecap="round" />
          </g>

          <!-- Detalhe sutil de régua de preço / coluna contábil -->
          <line x1="68" y1="36" x2="68" y2="88" stroke="#E5E0D5" stroke-width="1" stroke-dasharray="2 2" />
        </g>
      </svg>
    </div>

    <!-- Título Principal da Marca -->
    <div class="text-center px-4 max-w-[320px]">
      <h1 class="font-serif text-[38px] leading-[1.08] font-normal tracking-tight text-charcoal mb-2">
        Minhas Compras
      </h1>
      
      <!-- Subtítulo Canônico Exigido -->
      <p class="font-sans text-[14.5px] leading-relaxed text-charcoal-light font-normal">
        Sua próxima compra começa aqui.
      </p>
    </div>

  </main>

  <!-- Rodapé com Atividade Indeterminada e Texto Preciso -->
  <footer class="w-full flex flex-col items-center pb-4 anim-fade-up">
    
    <!-- Mensagem de carregamento sem estágios ou porcentagens artificiais -->
    <p class="font-sans text-[13px] text-charcoal-light/90 mb-3 tracking-normal">
      Preparando caderno de compras...
    </p>

    <!-- Indicador de atividade indeterminado contábil (linha refinada) -->
    <div class="w-40 h-[2.5px] bg-rule-dark/50 rounded-full relative overflow-hidden" role="progressbar" aria-label="Inicializando caderno de compras">
      <div class="track-runner absolute top-0 bottom-0 bg-leaf rounded-full"></div>
    </div>

    <!-- Ponto de ancoragem visual inferior -->
    <div class="mt-4 flex items-center justify-center space-x-1.5 opacity-60">
      <span class="text-[10px] tracking-widest uppercase font-mono text-charcoal-light">Registro Local Seguro</span>
    </div>
  </footer>

</body>
</html>
