<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, user-scalable=no">
  <title>Abertura — Minhas Compras</title>
  <!-- Google Fonts: Newsreader & Public Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            headline: ['Newsreader', 'Georgia', 'serif'],
            body: ['Public Sans', '-apple-system', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#FBF9F3',
              surface: '#FFFFFF',
              green: '#1F412D',
              text: '#1B1C18',
              divider: '#C1C8C1',
              // Dark mode tokens
              darkBg: '#20231E',
              darkSurface: '#30312D',
              darkText: '#F3F1EB',
              darkGreen: '#A9D0B4',
              darkDivider: '#424840',
            }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg: #FBF9F3;
      --surface: #FFFFFF;
      --green: #1F412D;
      --text: #1B1C18;
      --muted: #6B7268;
      --divider: #C1C8C1;
      --progress-bg: #E1E6DF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #20231E;
        --surface: #30312D;
        --green: #A9D0B4;
        --text: #F3F1EB;
        --muted: #A3A8A0;
        --divider: #424840;
        --progress-bg: #2C302A;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    /* Pauta sutil de caderno de fundo - sem distrações */
    .ruled-background {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to bottom, transparent 39px, var(--divider) 40px);
      background-size: 100% 40px;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Sequential Animation Choreography (1800ms sequence) */
    /* Intervalos calibrados para fácil mapeamento em CurvedAnimation / CustomPainter Flutter:
       0 - 300ms: Aparição suave da folha de papel / prancheta base
       200 - 650ms: Entrada sequencial das 3 linhas da lista
       650 - 1200ms: Checkboxes marcados sucessivamente (checkmarks verdes desenhados)
       1100 - 1650ms: Traçado da sacola de feira à direita
       1650 - 1800ms: Assentamento final e estabilização estática
    */

    .anim-paper {
      opacity: 0;
      transform: translateY(6px);
      animation: paperEnter 400ms cubic-bezier(0.16, 1, 0.3, 1) 50ms forwards;
    }

    @keyframes paperEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Linhas da lista entrando escalonadas */
    .anim-row-1 {
      opacity: 0;
      transform: translateX(-4px);
      animation: rowSlide 350ms cubic-bezier(0.16, 1, 0.3, 1) 250ms forwards;
    }
    .anim-row-2 {
      opacity: 0;
      transform: translateX(-4px);
      animation: rowSlide 350ms cubic-bezier(0.16, 1, 0.3, 1) 380ms forwards;
    }
    .anim-row-3 {
      opacity: 0;
      transform: translateX(-4px);
      animation: rowSlide 350ms cubic-bezier(0.16, 1, 0.3, 1) 500ms forwards;
    }

    @keyframes rowSlide {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Checkmarks verdes desenhados sequencialmente (stroke-dashoffset) */
    .anim-check-1 {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: drawCheck 260ms cubic-bezier(0.2, 0.8, 0.4, 1) 680ms forwards;
    }
    .anim-check-2 {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: drawCheck 260ms cubic-bezier(0.2, 0.8, 0.4, 1) 880ms forwards;
    }
    .anim-check-3 {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: drawCheck 260ms cubic-bezier(0.2, 0.8, 0.4, 1) 1080ms forwards;
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Sacola de compras que nasce à direita completando o emblema */
    .anim-bag {
      opacity: 0;
      transform: translateX(6px) scale(0.97);
      animation: bagReveal 480ms cubic-bezier(0.16, 1, 0.3, 1) 1200ms forwards;
    }

    @keyframes bagReveal {
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* Textos principais com fade-in suave */
    .anim-title {
      opacity: 0;
      transform: translateY(4px);
      animation: textFade 450ms cubic-bezier(0.16, 1, 0.3, 1) 700ms forwards;
    }
    .anim-subtitle {
      opacity: 0;
      transform: translateY(3px);
      animation: textFade 450ms cubic-bezier(0.16, 1, 0.3, 1) 950ms forwards;
    }

    @keyframes textFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Linha indeterminada de atividade que continua suavemente no rodapé */
    .indeterminate-bar {
      position: relative;
      width: 136px;
      height: 2px;
      background-color: var(--progress-bg);
      overflow: hidden;
      border-radius: 9999px;
    }

    .indeterminate-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 44px;
      background-color: var(--green);
      border-radius: 9999px;
      animation: loadingSlide 1400ms infinite ease-in-out 1800ms;
      transform: translateX(-100%);
    }

    @keyframes loadingSlide {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(110px);
      }
      100% {
        transform: translateX(150px);
      }
    }

    /* Suporte a prefers-reduced-motion: todos os elementos no estado final estático imediatamente */
    @media (prefers-reduced-motion: reduce) {
      .anim-paper,
      .anim-row-1,
      .anim-row-2,
      .anim-row-3,
      .anim-bag,
      .anim-title,
      .anim-subtitle {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
      .anim-check-1,
      .anim-check-2,
      .anim-check-3 {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
      .indeterminate-bar::after {
        animation: none !important;
        transform: translateX(45px) !important;
        width: 46px !important;
      }
    }
  </style>
</head>
<body class="relative flex flex-col justify-between items-center w-full h-full max-w-[390px] mx-auto select-none px-6 py-12">
  
  <!-- Pauta editorial de fundo sutil -->
  <div class="ruled-background"></div>

  <!-- Top spacer para respiro proporcional mobile (390x844) -->
  <div class="w-full h-8 z-10"></div>

  <!-- Centro: Ícone Emblema + Identidade de Marca -->
  <main class="relative z-10 flex flex-col items-center justify-center -mt-6">
    
    <!-- Emblema Vetorial 160x140: Lista de Feira -> Sacola de Mercado -->
    <div class="w-[160px] h-[140px] flex items-center justify-center mb-8 relative">
      <svg width="160" height="140" viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg" class="overflow-visible">
        
        <!-- Papel / Caderno de Compras (Bloco à esquerda) -->
        <g class="anim-paper">
          <!-- Folha de papel cartão -->
          <rect x="18" y="18" width="76" height="104" rx="4" fill="var(--surface)" stroke="var(--text)" stroke-width="1.75" />
          
          <!-- Grampo/Aba superior do caderno -->
          <path d="M42 18V13C42 11.8954 42.8954 11 44 11H68C69.1046 11 70 11.8954 70 13V18" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round" />
          
          <!-- Linha de corte/destaque superior sutil -->
          <line x1="26" y1="28" x2="86" y2="28" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 2" />
        </g>

        <!-- Linha 1 da lista (Item, quantidade e checkbox 4x4) -->
        <g class="anim-row-1">
          <!-- Caixa do checkbox 10x10 com cantos de 2px -->
          <rect x="26" y="38" width="10" height="10" rx="2" stroke="var(--text)" stroke-width="1.5" fill="var(--surface)" />
          <!-- Checkmark verde contábil desenhado -->
          <path class="anim-check-1" d="M28.5 43.2L31.2 45.8L38 38.5" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Traço de texto do item -->
          <line x1="42" y1="43" x2="72" y2="43" stroke="var(--text)" stroke-width="1.75" stroke-linecap="round" />
          <!-- Ponto/Badge discreto de quantidade -->
          <line x1="77" y1="43" x2="84" y2="43" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
        </g>

        <!-- Linha 2 da lista -->
        <g class="anim-row-2">
          <!-- Caixa do checkbox -->
          <rect x="26" y="58" width="10" height="10" rx="2" stroke="var(--text)" stroke-width="1.5" fill="var(--surface)" />
          <!-- Checkmark verde contábil desenhado -->
          <path class="anim-check-2" d="M28.5 63.2L31.2 65.8L38 58.5" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Traço de texto do item -->
          <line x1="42" y1="63" x2="68" y2="63" stroke="var(--text)" stroke-width="1.75" stroke-linecap="round" />
          <!-- Ponto/Badge discreto de quantidade -->
          <line x1="74" y1="63" x2="84" y2="63" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
        </g>

        <!-- Linha 3 da lista -->
        <g class="anim-row-3">
          <!-- Caixa do checkbox -->
          <rect x="26" y="78" width="10" height="10" rx="2" stroke="var(--text)" stroke-width="1.5" fill="var(--surface)" />
          <!-- Checkmark verde contábil desenhado -->
          <path class="anim-check-3" d="M28.5 83.2L31.2 85.8L38 78.5" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Traço de texto do item -->
          <line x1="42" y1="83" x2="70" y2="83" stroke="var(--text)" stroke-width="1.75" stroke-linecap="round" />
          <!-- Ponto/Badge discreto de quantidade -->
          <line x1="76" y1="83" x2="84" y2="83" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
        </g>

        <!-- Divisor sutil inferior da lista -->
        <line x1="26" y1="98" x2="86" y2="98" stroke="var(--divider)" stroke-width="1" />

        <!-- Sacola de Feira / Mercado (Conclusão do Emblema à direita) -->
        <g class="anim-bag">
          <!-- Corpo da sacola de mercado com sobreposição limpa ao caderno -->
          <path d="M84 48H132C133.657 48 135 49.3431 134.8 51L130.6 114C130.45 116.2 128.6 118 126.4 118H90.6C88.4 118 86.55 116.2 86.4 114L83.2 51C83 49.3431 84.3431 48 86 48Z" 
                fill="var(--surface)" stroke="var(--text)" stroke-width="1.75" stroke-linejoin="round" />
          
          <!-- Alça da sacola estruturada -->
          <path d="M97 48V35C97 29.4772 101.477 25 107 25H111C116.523 25 121 29.4772 121 35V48" 
                stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" />

          <!-- Detalhe da dobra frontal da sacola de papel artesanal -->
          <path d="M91 62L109 72L127 62" stroke="var(--divider)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
          
          <!-- Ramo / Etiqueta gráfica discreta da sacola -->
          <circle cx="109" cy="91" r="5" stroke="var(--green)" stroke-width="1.5" fill="none" />
          <path d="M109 87V95M105 91H113" stroke="var(--green)" stroke-width="1.25" stroke-linecap="round" />
        </g>

      </svg>
    </div>

    <!-- Título Minhas Compras em Newsreader 38px -->
    <h1 class="anim-title font-headline text-[38px] leading-[1.1] font-normal tracking-tight text-center mb-2.5">
      Minhas Compras
    </h1>

    <!-- Subtítulo em Public Sans com espaçamento equilibrado -->
    <p class="anim-subtitle font-body text-[14px] leading-relaxed font-normal tracking-[0.08em] text-[var(--muted)] text-center">
      Planeje. Marque. Leve.
    </p>

  </main>

  <!-- Rodapé: Linha de atividade contínua + Mensagem real do app -->
  <footer class="relative z-10 flex flex-col items-center justify-center pb-2 w-full">
    
    <!-- Linha indeterminada de progresso suave -->
    <div class="indeterminate-bar mb-3"></div>

    <!-- Mensagem de carregamento sem badges ou slogans falsos -->
    <span class="font-body text-[13px] tracking-wide text-[var(--muted)]">
      Preparando sua lista...
    </span>

  </footer>

</body>
</html>
