<body class="bg-background text-on-surface font-body antialiased min-h-screen flex justify-center items-center p-0 m-0">
<!-- Mobile Screen Shell (390px) -->
<div class="relative w-full max-w-[390px] h-[844px] overflow-hidden bg-background shadow-2xl flex flex-col justify-center">
<!-- Scrim / Background Context: Tela de Fechamento em desfoque contextual contábil -->
<div class="absolute inset-0 bg-background pointer-events-none filter blur-[2px] opacity-40 select-none p-5 flex flex-col justify-between">
<div>
<div class="h-6 w-32 bg-outline-variant/60 rounded mb-8"></div>
<div class="space-y-4">
<div class="flex justify-between py-2 border-b border-outline-variant">
<span class="font-headline text-lg text-on-surface">Café especial</span>
<span class="font-body text-sm text-on-surface">R$ 37,80</span>
</div>
<div class="flex justify-between py-2 border-b border-outline-variant">
<span class="font-headline text-lg text-on-surface">Pão artesanal</span>
<span class="font-body text-sm text-on-surface">R$ 14,50</span>
</div>
<div class="flex justify-between py-2 border-b border-outline-variant">
<span class="font-headline text-lg text-on-surface">Manteiga da fazenda</span>
<span class="font-body text-sm text-on-surface">R$ 16,90</span>
</div>
</div>
</div>
<div class="border-t-2 border-outline-variant pt-4 pb-8 flex justify-between items-center">
<span class="font-label text-sm font-medium">Total auditado</span>
<span class="font-label text-lg font-semibold">R$ 69,20</span>
</div>
</div>
<!-- Scrim Backdrop Modal Overlay -->
<div class="absolute inset-0 bg-on-surface/45 transition-opacity"></div>
<!-- AlertDialog: showCheckoutItemEditor (Flutter Modal Pattern) -->
<div class="relative z-10 mx-6 bg-surface-bright border border-outline-variant rounded-xl p-6 shadow-sm">
<!-- Diálogo Título -->
<h2 class="font-headline text-2xl font-normal text-on-surface leading-tight mb-6">
        Corrigir Café especial
      </h2>
<!-- Formulário com campos estritos -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Campo: Quantidade (Input puro, sem stepper/botões) -->
<div class="flex flex-col space-y-1.5">
<label class="font-body text-xs font-medium text-secondary" for="quantidade">
            Quantidade
          </label>
<input class="w-full bg-surface-bright text-on-surface font-body text-base border border-outline-variant rounded-lg px-3.5 py-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="quantidade" inputmode="numeric" name="quantidade" type="text" value="2"/>
</div>
<!-- Campo: Valor unitário -->
<div class="flex flex-col space-y-1.5">
<label class="font-body text-xs font-medium text-secondary" for="valor_unitario">
            Valor unitário
          </label>
<input class="w-full bg-surface-bright text-on-surface font-body text-base border border-outline-variant rounded-lg px-3.5 py-3 tabular-nums focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="valor_unitario" inputmode="decimal" name="valor_unitario" type="text" value="R$ 18,90"/>
</div>
<!-- Checkbox: Item comprado -->
<div class="pt-1 pb-1">
<label class="flex items-center space-x-3 cursor-pointer select-none">
<input checked="" class="w-5 h-5 rounded text-primary-container focus:ring-primary-container border-outline-variant cursor-pointer accent-primary-container" type="checkbox"/>
<span class="font-body text-sm font-normal text-on-surface">
              Item comprado
            </span>
</label>
</div>
<!-- Ações do Diálogo (Material AlertDialog Actions) -->
<div class="flex items-center justify-end space-x-2 pt-3">
<!-- Cancelar -->
<button class="min-h-[48px] px-4 font-body text-sm font-medium text-secondary hover:text-on-surface transition-colors active:opacity-75 focus:outline-none rounded-lg" type="button">
            Cancelar
          </button>
<!-- Aplicar correção -->
<button class="min-h-[48px] px-5 bg-primary-container text-on-primary font-body text-sm font-medium rounded-lg hover:bg-primary active:opacity-90 transition-all flex items-center justify-center shadow-none" type="submit">
            Aplicar correção
          </button>
</div>
</form>
</div>
</div>
