<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meus dados</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Public+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#fcfbf7',
            background: '#fcfbf7',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f5f3ed',
            'surface-container': '#f0eee8',
            'on-surface': '#1b1c18',
            'on-surface-variant': '#424843',
            primary: '#1f412d',
            'primary-hover': '#173323',
            'on-primary': '#ffffff',
            outline: '#727972',
            'outline-variant': '#c1c8c1',
            error: '#ba1a1a',
          },
          fontFamily: {
            headline: ['Newsreader', 'serif'],
            body: ['"Public Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #fcfbf7;
      color: #1b1c18;
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen bg-surface flex flex-col justify-between max-w-[390px] mx-auto border-x border-outline-variant/30">
<!-- Top App Bar -->
<header class="w-full px-4 h-14 flex items-center justify-between border-b border-outline-variant/40 bg-surface sticky top-0 z-10">
<div class="flex items-center gap-3">
<button aria-label="Voltar" class="p-1 -ml-1 text-on-surface hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline text-2xl font-normal tracking-tight text-on-surface">Meus dados</h1>
</div>
</header>
<!-- Conteúdo Principal -->
<main class="flex-1 px-4 py-6 flex flex-col">
<!-- Seção Cabeçalho Editorial do Perfil -->
<div class="mb-6">
<span class="text-[11px] font-semibold tracking-wider uppercase text-on-surface-variant/80 block mb-1">Conta pessoal</span>
<h2 class="font-headline text-3xl font-medium tracking-tight text-on-surface">Ficha do titular</h2>
<p class="font-body text-xs text-on-surface-variant mt-1.5 leading-relaxed">
        Atualize suas informações cadastrais para identificação no caderno e sincronização de compras.
      </p>
</div>
<form class="space-y-6 flex-1 flex flex-col justify-between">
<div class="space-y-5">
<!-- Foto de Perfil & URL -->
<div class="pb-5 border-b border-outline-variant/40">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-3">Foto de perfil</label>
<div class="flex items-center gap-4 mb-4">
<div class="w-16 h-16 rounded-full bg-surface-container-low border border-outline-variant/60 flex items-center justify-center overflow-hidden flex-shrink-0 text-primary">
<span class="material-symbols-outlined text-3xl text-primary/80">account_circle</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-xs text-on-surface font-medium">Avatar atual</span>
<button class="text-xs font-medium text-error hover:underline flex items-center gap-1 self-start" type="button">
<span class="material-symbols-outlined text-sm">delete</span>
                Remover
              </button>
</div>
</div>
<div>
<label class="block text-xs font-medium text-on-surface mb-1.5" for="foto-url">URL da foto (opcional)</label>
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest border border-outline-variant/80 rounded-md text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all font-body" id="foto-url" name="foto-url" placeholder="https://exemplo.com.br/sua-foto.jpg" type="url"/>
</div>
</div>
<!-- Nome Completo -->
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5" for="nome">Nome</label>
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest border border-outline-variant/80 rounded-md text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all font-body" id="nome" name="nome" type="text" value="Helena Ramos"/>
</div>
<!-- E-mail -->
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5" for="email">E-mail</label>
<input class="w-full px-3.5 py-2.5 bg-surface-container-lowest border border-outline-variant/80 rounded-md text-sm text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all font-body" id="email" name="email" type="email" value="helena.ramos@exemplo.com.br"/>
</div>
</div>
<!-- Ação Salvar Alterações -->
<div class="pt-6 pb-6">
<button class="w-full py-3.5 px-4 bg-primary hover:bg-primary-hover active:opacity-90 text-on-primary rounded-md font-body text-sm font-medium tracking-wide transition-all shadow-none flex items-center justify-center gap-2" type="button">
<span>Salvar alterações</span>
</button>
</div>
</form>
</main>
</body></html>
