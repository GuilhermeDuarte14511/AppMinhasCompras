<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Minhas Compras — Novo Saldo</title>
<!-- Google Fonts: Newsreader & Public Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#fbf9f3",
            "on-tertiary-fixed": "#321015",
            "tertiary-container": "#724549",
            "surface-bright": "#fbf9f3",
            "on-surface": "#1b1c18",
            "on-error-container": "#93000a",
            "error-container": "#ffdad6",
            "outline-variant": "#c1c8c1",
            "inverse-surface": "#30312d",
            "on-tertiary-container": "#f2b6ba",
            "on-tertiary-fixed-variant": "#663b3f",
            "primary-fixed-dim": "#a9d0b4",
            "on-primary-fixed-variant": "#2b4e39",
            "surface-dim": "#dcdad4",
            "primary-container": "#365943",
            "on-primary-fixed": "#002110",
            "surface-tint": "#43664f",
            "primary-fixed": "#c4eccf",
            "error": "#ba1a1a",
            "tertiary-fixed": "#ffdadb",
            "on-secondary-fixed-variant": "#444939",
            "surface-container-lowest": "#ffffff",
            "outline": "#727972",
            "surface-container-high": "#eae8e2",
            "surface": "#fbf9f3",
            "inverse-on-surface": "#f3f1eb",
            "on-secondary-fixed": "#191d10",
            "secondary-fixed-dim": "#c4c9b4",
            "surface-container-low": "#f5f3ed",
            "inverse-primary": "#a9d0b4",
            "on-secondary-container": "#616655",
            "on-secondary": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "surface-container-highest": "#e4e2dd",
            "secondary": "#5b604f",
            "on-surface-variant": "#424843",
            "on-primary-container": "#a7ceb2",
            "on-background": "#1b1c18",
            "tertiary-fixed-dim": "#f4b7bb",
            "primary": "#1f412d",
            "surface-container": "#f0eee8",
            "tertiary": "#582f33",
            "secondary-container": "#e0e5cf",
            "surface-variant": "#e4e2dd",
            "secondary-fixed": "#e0e5cf",
            "on-primary": "#ffffff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Newsreader", "serif"],
            "display": ["Newsreader", "serif"],
            "body": ["Public Sans", "sans-serif"],
            "label": ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .font-tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim flex justify-center items-center min-h-screen p-0 sm:p-4 font-body antialiased selection:bg-secondary-container selection:text-primary">
<!-- Mobile Viewport Container (390px canonical width) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-surface overflow-hidden shadow-2xl flex flex-col justify-between select-none">
<!-- BACKDROP SCREEN: "Saldos de pagamento" (Atrás do Dialog) -->
<div aria-hidden="true" class="absolute inset-0 flex flex-col pointer-events-none">
<!-- TopAppBar from Shared Components Specification -->
<header class="flex justify-between items-center w-full px-4 h-14 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flat no shadows z-10">
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<span class="font-headline text-lg font-normal tracking-tight text-on-surface dark:text-inverse-on-surface">
            Saldos de pagamento
          </span>
</div>
<button class="px-2 py-1 text-primary dark:text-inverse-primary font-medium text-sm" type="button">
          Salvar
        </button>
</header>
<!-- Background Content List (Visual Mockup of Payment Balances) -->
<main class="flex-1 px-4 py-5 overflow-hidden flex flex-col gap-6">
<!-- Summary Band -->
<div class="pb-4 border-b border-outline-variant">
<div class="text-xs uppercase tracking-wider text-on-surface-variant font-medium">Total disponível</div>
<div class="font-headline text-3xl text-on-surface font-normal font-tabular mt-0.5">R$ 684,50</div>
</div>
<!-- Section List -->
<div class="flex flex-col gap-3">
<div class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Métodos cadastrados</div>
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-3 flex justify-between items-center">
<div>
<div class="font-medium text-on-surface text-sm">Alimentação Sodexo</div>
<div class="text-xs text-on-surface-variant">Vale alimentação (VA)</div>
</div>
<div class="text-right">
<span class="font-headline text-base font-normal font-tabular text-on-surface">R$ 484,50</span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-3 flex justify-between items-center opacity-60">
<div>
<div class="font-medium text-on-surface text-sm">Carteira Dinheiro</div>
<div class="text-xs text-on-surface-variant">Dinheiro em espécie</div>
</div>
<div class="text-right">
<span class="font-headline text-base font-normal font-tabular text-on-surface">R$ 0,00</span>
</div>
</div>
</div>
</main>
</div>
<!-- MODAL SCRIM OVERLAY (Flutter AlertDialog Scrim: rgba(0, 0, 0, 0.45)) -->
<div class="absolute inset-0 bg-black/45 z-20 flex items-center justify-center p-4">
<!-- FLUTTER ALERT DIALOG (_showPaymentBalanceEntryDialog) -->
<section aria-labelledby="dialog-title" aria-modal="true" class="w-full bg-[#F7F5EF] rounded-2xl border border-[#D9DCD3] shadow-lg p-6 flex flex-col gap-5 text-[#252923] relative z-30" role="dialog">
<!-- Diálogo Título -->
<header class="flex items-center justify-between pb-1">
<h2 class="font-headline text-2xl font-normal text-[#252923] tracking-tight" id="dialog-title">
            Novo saldo
          </h2>
</header>
<!-- Form Content -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- 1. Campo "Nome" -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-[#252923]" for="balance-name">
              Nome
            </label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest border border-[#D9DCD3] rounded-lg text-sm text-[#252923] font-normal placeholder-[#62695F] focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" id="balance-name" placeholder="Ex.: VR Alimentação" type="text" value="VR Alelo"/>
</div>
</div>
<!-- 2. Campo "Tipo" (DropdownButtonFormField) -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold text-[#252923]" for="balance-type">
              Tipo
            </label>
<div class="relative">
<select class="w-full h-12 pl-3.5 pr-10 bg-surface-container-lowest border border-[#D9DCD3] rounded-lg text-sm text-[#252923] font-normal appearance-none focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all cursor-pointer" id="balance-type">
<option selected="" value="vr">Vale refeição (VR)</option>
<option value="va">Vale alimentação (VA)</option>
<option value="debito">Débito / Conta corrente</option>
<option value="dinheiro">Dinheiro</option>
<option value="outro">Outro saldo</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- 3. Campo "Saldo disponível" -->
<div class="flex flex-col gap-1">
<label class="text-xs font-semibold text-[#252923]" for="balance-amount">
              Saldo disponível
            </label>
<div class="relative flex items-center">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest border border-[#D9DCD3] rounded-lg text-base font-normal font-tabular text-[#252923] focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" id="balance-amount" inputmode="decimal" type="text" value="R$ 200,00"/>
</div>
<!-- Texto de apoio sutil -->
<p class="text-[12px] text-[#62695F] leading-tight mt-0.5">
              Valor inicial para controle de compras
            </p>
</div>
<!-- Ações Inferiores (AlertDialog actions) -->
<div class="flex items-center justify-end gap-2.5 pt-3 mt-1">
<!-- Botão Cancelar -->
<button class="min-h-[48px] px-4 py-2.5 rounded-lg text-sm font-medium text-[#252923] hover:bg-surface-container-high transition-colors active:opacity-80" type="button">
              Cancelar
            </button>
<!-- Botão Salvar -->
<button class="min-h-[48px] px-6 py-2.5 bg-primary-container hover:bg-primary text-white rounded-lg text-sm font-medium transition-colors active:opacity-90 shadow-sm flex items-center justify-center" type="submit">
              Salvar
            </button>
</div>
</form>
</section>
</div>
</div>
</body></html>
